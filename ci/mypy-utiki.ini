[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
show_error_codes = True
pretty = False
namespace_packages = True
explicit_package_bases = True
mypy_path = src

# Existing shared modules are outside this initial uTiki typed scope.  These
# exact-module skips isolate their pre-existing debt; the runner rejects a
# global/wildcard skip and all broad ignore_errors escapes.  Calls that expose
# Any inside the three explicit scope files still fail under --strict.
[mypy-util]
follow_imports = skip

# Importing a typed family submodule also loads the legacy package initializer.
# These exact legacy modules remain outside the P1 seed scope and are scheduled
# for replacement/removal; new domain/application/adapters receive no override.
[mypy-platforms.utiki]
follow_imports = skip
