          python tools/generate_utiki_execution_manifest.py --root . --phase P2 --required-catalog ci/utiki-required-cases.json --approved-catalog-sha256 "$APPROVED_CATALOG_SHA256" --binding-registry ci/utiki-p2-execution-bindings.json --output tests/fixtures/utiki/manifest-p2.json --check
      - name: Prebuild digest-pinned isolation image
        run: |
          python tools/build_utiki_isolation_image.py --repository-root . --base-image "$PINNED_BASE_IMAGE" --tag "$ISOLATION_IMAGE_TAG" --evidence "$JOB_RUN_DIR/evidence/image-build.json"
          echo "ISOLATION_IMAGE_ID=$(jq -r .image_id "$JOB_RUN_DIR/evidence/image-build.json")" >> "$GITHUB_ENV"
      - name: Produce isolated performance envelope
        run: >-
          python tools/run_utiki_evidence.py --repository-root . --execution-manifest tests/fixtures/utiki/manifest-p2.json
          --artifact-root "$JOB_RUN_DIR"
          --report "$JOB_RUN_DIR/evidence/browser-isolation-report.json" --kind browser-isolation-report --run-id "$P2_RUN_ID"
          --attempt "${{ github.run_attempt }}" --job-id performance-contract --phase P2 --target isolated-linux-x64
          --candidate-sha "$CANDIDATE_SHA" --catalog-sha256 "$APPROVED_CATALOG_SHA256"
          --producer tools/run_utiki_performance_isolation.py
          --input performance-contract repository ci/utiki-p2-performance-isolation.json
          --input execution-manifest repository tests/fixtures/utiki/manifest-p2.json
          --input image-build artifact evidence/image-build.json
          --producer-report evidence/performance-isolation-raw.json --
          --contract "$GITHUB_WORKSPACE/ci/utiki-p2-performance-isolation.json" --image "$ISOLATION_IMAGE_ID"
          --image-build-evidence "$JOB_RUN_DIR/evidence/image-build.json"
          --execution-manifest "$GITHUB_WORKSPACE/tests/fixtures/utiki/manifest-p2.json" --run-dir "$JOB_RUN_DIR/evidence"
          --report "$JOB_RUN_DIR/evidence/performance-isolation-raw.json" --run-id "$P2_RUN_ID"
          --attempt "${{ github.run_attempt }}" --phase P2 --catalog-sha256 "$APPROVED_CATALOG_SHA256" --candidate-sha "$CANDIDATE_SHA"
      - name: Verify and envelope benchmark evidence
        run: >-
          python tools/run_utiki_evidence.py --repository-root . --execution-manifest tests/fixtures/utiki/manifest-p2.json
          --artifact-root "$JOB_RUN_DIR"
          --report "$JOB_RUN_DIR/evidence/benchmark-report.json" --kind benchmark-report --run-id "$P2_RUN_ID"
          --attempt "${{ github.run_attempt }}" --job-id performance-contract --phase P2 --target isolated-linux-x64
          --candidate-sha "$CANDIDATE_SHA" --catalog-sha256 "$APPROVED_CATALOG_SHA256"
          --producer tools/benchmarks/verify_utiki_p1_performance.py
          --input performance-contract repository ci/utiki-p2-performance-isolation.json
          --input performance-isolation-report artifact evidence/performance-isolation-raw.json
          --input raw-benchmark-report artifact evidence/raw-benchmark-report.json
          --input managed-junit artifact evidence/performance.xml
          --input reporter-result artifact evidence/performance-reporter-result.json
          --producer-report evidence/performance-verification-raw.json --
          --contract "$GITHUB_WORKSPACE/ci/utiki-p2-performance-isolation.json"
          --isolation-report "$JOB_RUN_DIR/evidence/performance-isolation-raw.json"
          --raw-benchmark-report "$JOB_RUN_DIR/evidence/raw-benchmark-report.json"
          --junit "$JOB_RUN_DIR/evidence/performance.xml"
          --reporter-result "$JOB_RUN_DIR/evidence/performance-reporter-result.json"
          --output "$JOB_RUN_DIR/evidence/performance-verification-raw.json"
      - name: Assemble and verify isolated performance job
        run: |
          python tools/assemble_utiki_isolated_job.py --repository-root . --required-catalog ci/utiki-required-cases.json --execution-manifest tests/fixtures/utiki/manifest-p2.json --run-dir "$JOB_RUN_DIR" --run-id "$P2_RUN_ID" --attempt "${{ github.run_attempt }}" --job-id performance-contract --phase P2 --target isolated-linux-x64 --candidate-sha "$CANDIDATE_SHA" --catalog-sha256 "$APPROVED_CATALOG_SHA256" --junit "$JOB_RUN_DIR/evidence/performance.xml" --reporter-result "$JOB_RUN_DIR/evidence/performance-reporter-result.json" --inner-report "$JOB_RUN_DIR/evidence/inner-performance-report.json" --resource fixture "$JOB_RUN_DIR/resources/fixture.html" --resource script "$JOB_RUN_DIR/resources/script.py" --artifact browser-isolation-report "$JOB_RUN_DIR/evidence/browser-isolation-report.json" --artifact benchmark-report "$JOB_RUN_DIR/evidence/benchmark-report.json"
          python tools/verify_utiki_ci_results.py --required-catalog ci/utiki-required-cases.json --approved-catalog-sha256 "$APPROVED_CATALOG_SHA256" --execution-manifest tests/fixtures/utiki/manifest-p2.json --junit "$JOB_RUN_DIR/junit.xml" --run-metadata "$JOB_RUN_DIR/run-metadata.json" --phase P2 --run-id "$P2_RUN_ID" --job-id performance-contract --target isolated-linux-x64 --candidate-sha "$CANDIDATE_SHA" --require-browser --report "$JOB_RUN_DIR/gate-report.json"
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: utiki-p2-performance-contract
          path: ${{ env.JOB_RUN_DIR }}
          if-no-files-found: error

  aggregate:
    name: aggregate / P2
    if: always()
    needs:
      - unit-contract
      - modified-python-syntax
      - architecture-types
      - browser-contract-isolated
      - performance-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGGREGATE_DIR: /tmp/utiki-p2-${{ github.run_id }}-${{ github.run_attempt }}/aggregate
      FORMAL_APPROVED_CATALOG_SHA256: ${{ vars.UTIKI_P1_APPROVED_CATALOG_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
      - name: Require every producer job to succeed
        env:
          UNIT_CONTRACT_RESULT: ${{ needs.unit-contract.result }}
          MODIFIED_PYTHON_SYNTAX_RESULT: ${{ needs.modified-python-syntax.result }}
          ARCHITECTURE_TYPES_RESULT: ${{ needs.architecture-types.result }}
          BROWSER_CONTRACT_ISOLATED_RESULT: ${{ needs.browser-contract-isolated.result }}
          PERFORMANCE_CONTRACT_RESULT: ${{ needs.performance-contract.result }}
        run: |
          mkdir -p "$AGGREGATE_DIR"
          env | grep '_RESULT=' | sort > "$AGGREGATE_DIR/producer-results.txt"
          test "$UNIT_CONTRACT_RESULT" = success
          test "$MODIFIED_PYTHON_SYNTAX_RESULT" = success
          test "$ARCHITECTURE_TYPES_RESULT" = success
          test "$BROWSER_CONTRACT_ISOLATED_RESULT" = success
          test "$PERFORMANCE_CONTRACT_RESULT" = success
      - uses: actions/download-artifact@v8
        with:
          name: utiki-p2-unit-contract
          path: ${{ env.AGGREGATE_DIR }}/unit-contract
      - uses: actions/download-artifact@v8
        with:
          name: utiki-p2-modified-python-syntax
          path: ${{ env.AGGREGATE_DIR }}/modified-python-syntax
      - uses: actions/download-artifact@v8
        with:
          name: utiki-p2-architecture-types
          path: ${{ env.AGGREGATE_DIR }}/architecture-types
      - uses: actions/download-artifact@v8
        with:
          name: utiki-p2-browser-contract-isolated
          path: ${{ env.AGGREGATE_DIR }}/browser-contract-isolated
      - uses: actions/download-artifact@v8
        with:
          name: utiki-p2-performance-contract
          path: ${{ env.AGGREGATE_DIR }}/performance-contract
      - name: Require independent catalog approval
        shell: bash
        run: |
          if [[ ! "$FORMAL_APPROVED_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=uTiki P2 catalog approval missing::A maintainer-controlled approved catalog digest is required for the formal aggregate." >&2
            exit 2
          fi
      - name: Build digest-bound run index
        run: >-
          python tools/build_utiki_run_index.py --required-catalog ci/utiki-required-cases.json
          --approved-catalog-sha256 "$FORMAL_APPROVED_CATALOG_SHA256" --execution-manifest tests/fixtures/utiki/manifest-p2.json
          --phase P2 --run-id "$P2_RUN_ID" --attempt "${{ github.run_attempt }}" --candidate-sha "$CANDIDATE_SHA"
          --output "$AGGREGATE_DIR/gate-runs.json"
          --run unit-contract source-linux-x64 "$AGGREGATE_DIR/unit-contract"
          --run modified-python-syntax source-linux-x64 "$AGGREGATE_DIR/modified-python-syntax"
          --run architecture-types source-linux-x64 "$AGGREGATE_DIR/architecture-types"
          --run browser-contract-isolated isolated-linux-x64 "$AGGREGATE_DIR/browser-contract-isolated"
          --run performance-contract isolated-linux-x64 "$AGGREGATE_DIR/performance-contract"
      - name: Verify aggregate P2 gate
        run: >-
          python tools/verify_utiki_ci_results.py --required-catalog ci/utiki-required-cases.json
          --approved-catalog-sha256 "$FORMAL_APPROVED_CATALOG_SHA256" --execution-manifest tests/fixtures/utiki/manifest-p2.json
          --run-index "$AGGREGATE_DIR/gate-runs.json" --phase P2 --run-id "$P2_RUN_ID"
          --candidate-sha "$CANDIDATE_SHA" --report "$AGGREGATE_DIR/gate-report.json"
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: utiki-p2-aggregate
          path: ${{ env.AGGREGATE_DIR }}
          if-no-files-found: error
