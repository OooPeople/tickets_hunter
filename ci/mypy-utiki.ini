[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
show_error_codes = True
pretty = False
namespace_packages = True
explicit_package_bases = True
mypy_path = src

# Existing shared modules remain outside the current uTiki typed scope.
# These exact-module skips isolate their historical typing debt; production
# adapter values are checked by the typed code and behavior tests.
[mypy-util]
follow_imports = skip

# Batch 3's narrow adapter consumes these existing shared modules; their
# historical typing debt stays outside the uTiki typed scope. The adapter
# validates the values it uses and returns typed receipts.
[mypy-global_settings]
follow_imports = skip

[mypy-refresh_coordinator]
follow_imports = skip

# Historical direct-call modules remain outside this scope;
# new domain/application/adapters receive no override.
[mypy-platforms.utiki]
follow_imports = skip
