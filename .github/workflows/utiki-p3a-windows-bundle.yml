name: uTiki P3a Windows Bundle Diagnostic

on:
  push:
    branches:
      - refactor/17-utiki-root-v1-5
    paths:
      - .github/workflows/utiki-p3a-windows-bundle.yml
      - src/platforms/utiki/scripts/**
      - src/platforms/utiki/adapters/script_resources.py
      - src/nodriver_tixcraft.py
      - src/nodriver_common.py
      - requirement.txt
      - build_scripts/build_local.py
      - build_scripts/nodriver_tixcraft.spec
      - build_scripts/settings.spec
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bundle:
    if: >-
      github.repository == 'OooPeople/tickets_hunter' &&
      github.ref == 'refs/heads/refactor/17-utiki-root-v1-5'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: requirement.txt
      - name: Assert native Windows x64 and fixed source
        shell: pwsh
        run: |
          if (-not $IsWindows -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [System.Runtime.InteropServices.Architecture]::X64) {
            throw 'Native Windows x64 is required'
          }
          Write-Host "candidate_sha=$env:GITHUB_SHA"
          Write-Host "os=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "architecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
      - name: Install offline-build dependencies
        shell: pwsh
        run: python -m pip install -r requirement.txt pyinstaller==6.22.3
      - name: Build and verify bot/settings final bundle
        shell: pwsh
        run: |
          python build_scripts/build_local.py --keep > p3a-build.stdout.log 2> p3a-build.stderr.log
          $buildExit = $LASTEXITCODE
          Get-Content p3a-build.stdout.log
          Get-Content p3a-build.stderr.log
          if ($buildExit -ne 0) { exit $buildExit }
          $sourceManifest = 'src/platforms/utiki/scripts/manifest.json'
          $bundleManifest = 'dist/tickets_hunter/_internal/platforms/utiki/scripts/manifest.json'
          $sourceDigest = (Get-FileHash -Algorithm SHA256 $sourceManifest).Hash.ToLowerInvariant()
          $bundleDigest = (Get-FileHash -Algorithm SHA256 $bundleManifest).Hash.ToLowerInvariant()
          Write-Host "source_manifest_sha256=$sourceDigest"
          Write-Host "bundle_manifest_sha256=$bundleDigest"
          if ($sourceDigest -ne $bundleDigest) { throw 'Final bundle manifest differs from source' }
      - name: Preserve native diagnostic output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: utiki-p3a-windows-bundle-diagnostic
          path: |
            p3a-build.stdout.log
            p3a-build.stderr.log
            build/*/warn-*.txt
            dist/tickets_hunter/_internal/platforms/utiki/scripts/manifest.json
          if-no-files-found: warn
