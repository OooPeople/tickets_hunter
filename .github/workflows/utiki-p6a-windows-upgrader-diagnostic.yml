name: uTiki P6a Windows Upgrader Diagnostic

on:
  push:
    branches:
      - refactor/17-utiki-root-v1-5
    paths:
      - .github/workflows/utiki-p6a-windows-upgrader-diagnostic.yml
      - build_scripts/utiki_profile_upgrader.spec
      - build_scripts/test_frozen_utiki_upgrade.py
      - tools/migrations/convert_utiki_config.py
      - src/utiki_config.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-upgrader-diagnostic:
    if: >-
      github.repository == 'OooPeople/tickets_hunter' &&
      github.ref == 'refs/heads/refactor/17-utiki-root-v1-5'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Assert native Windows x64 and exact candidate
        shell: pwsh
        run: |
          if (-not $IsWindows -or [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [System.Runtime.InteropServices.Architecture]::X64) {
            throw 'Native Windows x64 is required'
          }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw 'Checkout does not match the workflow candidate SHA'
          }
          Write-Host "candidate_sha=$env:GITHUB_SHA"
          Write-Host "architecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
      - name: Install test packager
        shell: pwsh
        run: python -m pip install pyinstaller==6.22.3
      - name: Build standalone upgrader
        shell: pwsh
        run: |
          python -m PyInstaller build_scripts/utiki_profile_upgrader.spec --distpath dist-upgrader --workpath build-upgrader --noconfirm > upgrader-build.stdout.log 2> upgrader-build.stderr.log
          $buildExit = $LASTEXITCODE
          Get-Content upgrader-build.stdout.log
          Get-Content upgrader-build.stderr.log
          if ($buildExit -ne 0) { exit $buildExit }
          $executable = 'dist-upgrader/utiki-profile-upgrader/utiki-profile-upgrader.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'Frozen upgrader executable is absent' }
          Write-Host "spec_sha256=$((Get-FileHash -Algorithm SHA256 build_scripts/utiki_profile_upgrader.spec).Hash.ToLowerInvariant())"
          Write-Host "executable_sha256=$((Get-FileHash -Algorithm SHA256 $executable).Hash.ToLowerInvariant())"
      - name: Run synthetic frozen upgrader smoke
        shell: pwsh
        run: |
          python build_scripts/test_frozen_utiki_upgrade.py --executable dist-upgrader/utiki-profile-upgrader/utiki-profile-upgrader.exe > upgrader-smoke.stdout.log 2> upgrader-smoke.stderr.log
          $smokeExit = $LASTEXITCODE
          Get-Content upgrader-smoke.stdout.log
          Get-Content upgrader-smoke.stderr.log
          exit $smokeExit
      - name: Preserve native diagnostic output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: utiki-p6a-windows-upgrader-diagnostic
          path: |
            upgrader-build.stdout.log
            upgrader-build.stderr.log
            upgrader-smoke.stdout.log
            upgrader-smoke.stderr.log
            build-upgrader/*/warn-*.txt
            dist-upgrader/utiki-profile-upgrader/**
          if-no-files-found: warn
