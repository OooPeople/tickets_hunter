<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>CTBC dialog fixture</title>
  <style>
    .ui-dialog { display: block; visibility: visible; width: 20rem; height: 8rem; }
  </style>
</head>
<body data-dialog-clicks="0">
  <!-- Page kind: dialog. Fixture date: 2026-10-15. Synthetic/deidentified. -->
  <div class="ui-dialog">
    <div id="dialog-message">該位置已被選走</div>
    <div class="ui-dialog-buttonset">
      <button type="button" onclick="dismissFixtureDialog(this)">確定</button>
    </div>
  </div>
  <script>
    function dismissFixtureDialog(button) {
      document.body.dataset.dialogClicks = String(
        Number(document.body.dataset.dialogClicks || 0) + 1
      );
      button.closest('.ui-dialog').style.display = 'none';
    }
  </script>
</body>
</html>
