<html lang="zh-Hant"><head><meta charset="utf-8"><title>Synthetic area flow</title></head>
<body>

    <button id="byhend" class="active" type="button">手動選位</button></div>
  <div class="seats"><table class="f1"><tbody><tr class="saleTr" rel="front"
    onclick="Send('0202','P16D0B8Z','PRICE_FRONT','','45')">

    src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">

  <script>
    window.mainMap = {front: true};
    function Send(_page, performanceId, priceAreaId, groupId) {
      setTimeout(() => {
        location.href = 'UTK0203_flow.html?PERFORMANCE_ID=' + performanceId +
          '&GROUP_ID=' + groupId + '&PERFORMANCE_PRICE_AREA_ID=' + priceAreaId;
      }, 20);
    }
  </script>
